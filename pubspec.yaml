name: syami
description: Compares your local fasting hours with Mecca's and shows the iftar time that matches Mecca's fasting duration.
publish_to: 'none'

# versionName+versionCode on Android. The build number must be higher than
# every build ever uploaded to Google Play.
version: 1.0.19+21

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.1
  dio: ^5.4.1
  dio_smart_retry: ^7.0.1
  flutter_screenutil: ^5.3.1
  geolocator: ^14.0.2
  geocoding: ^5.0.1
  intl: ^0.20.2
  pull_to_refresh: ^2.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

# `dart run flutter_launcher_icons` regenerates the launcher icons.
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
